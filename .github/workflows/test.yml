# Runs the contract suite on Linux, macOS and Windows. A thin wrapper: everything it checks is
# `npm run ci`, which runs the same way on any machine or CI provider. It only tests; GitHub Pages
# still publishes `main` with its own (legacy) build, which this workflow never touches.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's own Chromium (the version @playwright/test pins), plus its system libraries and
      # fonts on Linux. --no-shell: the suite uses the full browser, not the headless shell.
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
